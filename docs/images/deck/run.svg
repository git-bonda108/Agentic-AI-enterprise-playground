</g><text x="862" y="100" font-size="15" font-weight="600" fill="#7C3AED" text-anchor="start" letter-spacing="1.8">03 · ROUTE</text><text x="862" y="136" font-size="24" font-weight="600" fill="#14122B" text-anchor="start">Smart routing</text><text x="862" y="170" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">The cheapest capable model;</text><text x="862" y="194" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">the saving is recorded</text><rect x="1250" y="60" width="340" height="170" rx="18" fill="#FFFFFF" stroke="#E4E2F0" filter="url(#shadow)"/><g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.2958;0.3167;0.3958;0.4167;1.0000" values="0;0;1;1;0;0"/>

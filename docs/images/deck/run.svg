</g><text x="38" y="100" font-size="15" font-weight="600" fill="#7C3AED" text-anchor="start" letter-spacing="1.8">01 · ASK</text><text x="38" y="136" font-size="24" font-weight="600" fill="#14122B" text-anchor="start">Blueprint and input</text><text x="38" y="170" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">A person, a schedule, an SDK</text><text x="38" y="194" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">call or an MCP client starts it</text><rect x="426" y="60" width="340" height="170" rx="18" fill="#FFFFFF" stroke="#E4E2F0" filter="url(#shadow)"/><g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.0958;0.1167;0.1958;0.2167;1.0000" values="0;0;1;1;0;0"/>

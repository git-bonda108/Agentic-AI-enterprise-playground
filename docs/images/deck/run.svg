</g><text x="1274" y="100" font-size="15" font-weight="600" fill="#7C3AED" text-anchor="start" letter-spacing="1.8">04 · REASON</text><text x="1274" y="136" font-size="24" font-weight="600" fill="#14122B" text-anchor="start">Steps, tools, retrieval</text><text x="1274" y="170" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">Code where it can be, the model</text><text x="1274" y="194" font-size="17" font-weight="400" fill="#454A63" text-anchor="start">where judgement is needed</text><rect x="1250" y="370" width="340" height="170" rx="18" fill="#FFFFFF" stroke="#E4E2F0" filter="url(#shadow)"/><g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.3958;0.4167;0.6333;0.6542;1.0000" values="0;0;1;1;0;0"/>

# Local stack for the Enterprise AI Playground.
# Postgres with pgvector (state, ledger, embeddings), Redis (sessions, leaderboards), LiteLLM (AI gateway).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    depends_on: [postgres]
    ports: ["4000:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      DATABASE_URL: postgresql://playground:playground@postgres:5432/playground
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    volumes: ["./litellm.config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]

volumes:
  pgdata:

[project]
name = "playground-api"
version = "0.1.0"
description = "Enterprise AI Playground API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "litellm>=1.100",
  "sqlalchemy>=2.0",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "pandas>=2.2",
  "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.36.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI dependency injection uses Depends() in defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

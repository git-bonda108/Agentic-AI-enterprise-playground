name: Build and push images

# Builds both container images and pushes them to the Azure Container Registry the deploy script created, for
# subscriptions where ACR Tasks (cloud builds) are not permitted. Then run:
#   IMAGE_BUILD=skip infra/deploy.sh <resource-group> <location> <prefix> <tag>
# Secrets: ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD (the registry's admin credential).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag; defaults to the short commit sha"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ inputs.tag || github.sha }}" | sed 's/tag=\(.\{7\}\).*$/tag=\1/' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.x" }
      - run: npm ci && npm run build:jupyterlite
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/playground-api:${{ steps.tag.outputs.tag }}
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/playground-web:${{ steps.tag.outputs.tag }}
      - run: echo "pushed playground-api and playground-web with tag ${{ steps.tag.outputs.tag }}"
